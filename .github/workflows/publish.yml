name: Publish Python distribution to Github Make Docker container image

on: 
    push:
        branches: 
        - 'private_workflow'
        tags:
        - 'v[0-9]+.[0-9]+.dev[0-9]+' # glob pattern for semantic version tags like v1.0.1

env:
  DEFAULT_PYTHON: "3.12"

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.DEFAULT_PYTHON }}
        check-latest: true
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install -r requirements.txt
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v6
      with:
        name: python-package-distributions
        path: dist/

  check_version:
    name: Check the version
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract tag version
        id: extract_tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Check tag in package
        run: |
          if ! grep -q "__version__ = \"$TAG_VERSION\"" ./docker2mqtt/__init__.py; then
            echo "Error: Tag version $TAG_VERSION not found in the package."
            exit 1
          else
            echo "Success: Tag version $TAG_VERSION found in package."
          fi

      - name: Check if version type matches branch type
        run: |
          branch=$(git branch -r --contains ${{ github.ref }} --format "%(refname:lstrip=3)" | grep -v '^HEAD$')
          echo "Branch: $branch"
          version=${GITHUB_REF#refs/tags/}
          echo "Version from tag: $version"

          # Check if the version is a prerelease
          if [[ "$version" =~ [a-zA-Z] ]]; then
            echo "Prerelease version detected: $version"
            prerelease=true
          else
            echo "Final release version detected: $version"
            prerelease=false
          fi

          # Fail if it's a prerelease and on the master branch
          if [[ "$branch" == "master" && "$prerelease" == "true" ]]; then
            echo "Error: Prerelease versions are not allowed on the master branch."
            exit 1
          fi

          # Fail if it's a final release on a non-master branch
          if [[ "$branch" != "master" && "$prerelease" == "false" ]]; then
            echo "Error: Final releases are not allowed on non-master branches."
            exit 1
          fi

  publish-to-ghcr:
    name: Publish Docker Image to Container Registry
    needs: check_version
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    timeout-minutes: 15
    steps:
    - name: Check out the repo
      uses: actions/checkout@v6
    - name: Docker meta
      id: docker_meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/miaucl/docker2mqtt
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/amd64,linux/arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: nashja
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to GitHub Packages
      uses: docker/build-push-action@v6
      with:
        file: Dockerfile
        push: true
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64  
